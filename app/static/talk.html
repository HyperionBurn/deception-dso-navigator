<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk · Voice of the Oasis</title>
  <link rel="stylesheet" href="./app.css">
  <style>
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 small { font-weight: 400; color: var(--muted); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
    .controls input { flex: 1 1 180px; padding: 10px 12px; border: 1px solid #3e594a; border-radius: 8px; background: #142720; color: inherit; font: inherit; }
    .controls select { padding: 10px; border: 1px solid #3e594a; border-radius: 8px; background: #142720; color: inherit; font: inherit; }
    .controls button.primary { padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #10211a; font: 700 1rem inherit; cursor: pointer; }
    .controls button.primary:disabled { opacity: .55; cursor: wait; }
    .state { font: .85rem var(--mono); color: var(--muted); margin: 6px 0 14px; }
    .state.connected { color: var(--accent); }
    .error { color: #f3a8a0; font-size: .9rem; }
    .messages { max-height: 55vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./talk/talk.js"></script>
</body>
</html>
